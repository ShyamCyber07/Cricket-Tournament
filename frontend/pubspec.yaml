name: cricket_scorer
description: A modern, Android-first CricHeroes MVP cricket scoring application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Network & API
  dio: ^5.4.0

  # UI & Styling
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.7.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  flutter_spinkit: ^5.2.0

  # Data Visualization
  fl_chart: ^0.66.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
